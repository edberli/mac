<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import * as K from './lib/kit2d.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d'); K.bind(ctx);
window.setTimeline = () => {};
window.render = (f) => {
  const g = ctx.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, '#2a3a5a'); g.addColorStop(1, '#6a7f9f'); ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
  const poses = [[0, -0.1, 0], [0, 0.0, 1.2], [0.55, 0.85, 2.4]];
  poses.forEach(([lean, look, t], i) => { ctx.save(); ctx.translate(330 + i * 620, 700); ctx.scale(2.1, 2.1); K.drawHuman(0, 0, t, 0, lean, look, '#9fd0ff'); ctx.restore(); });
  return cv.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
