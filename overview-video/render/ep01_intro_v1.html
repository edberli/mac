<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let TL = null; window.setTimeline = tl => { TL = tl; };

// ---------------- utils ----------------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function mix(h1, h2, t) { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  return `rgb(${Math.round(lerp(a >> 16, b >> 16, t))},${Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t))},${Math.round(lerp(a & 255, b & 255, t))})`; }
function rrect(c, x, y, w, h, r) { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function offscreen(w, h, draw) { const o = document.createElement('canvas'); o.width = w; o.height = h; draw(o.getContext('2d'), o); return o; }

// ---------------- film finish ----------------
const noise = offscreen(512, 512, (n) => { const im = n.createImageData(512, 512), r = rng(3);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } n.putImageData(im, 0, 0); });
function grain(alpha, f) { const r = rng(1000 + f); ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'overlay';
  const ox = -r() * 512, oy = -r() * 512; for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) ctx.drawImage(noise, x, y); ctx.restore(); }
function vignette(a) { const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function bloomSun(x, y, r, inner, mid, a = 1) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, hexA(inner, 0.9 * a)); g.addColorStop(0.07, hexA(inner, 0.55 * a)); g.addColorStop(0.35, hexA(mid, 0.16 * a)); g.addColorStop(1, hexA(mid, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function sunsetSky(stops) { const g = ctx.createLinearGradient(0, 0, 0, H); stops.forEach(([o, c]) => g.addColorStop(o, c)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
const STARS = (() => { const r = rng(5); return Array.from({ length: 420 }, () => [r() * W, r() * H, r() * 1.4 + 0.3, r() * 6]); })();
function stars(a, t, maxY = H) { if (a <= 0) return; for (const [x, y, r, ph] of STARS) if (y < maxY) { ctx.fillStyle = `rgba(255,255,255,${a * (0.35 + 0.3 * Math.sin(t * 2 + ph))})`; ctx.fillRect(x, y, r, r); } }
const DUST = (() => { const r = rng(9); return Array.from({ length: 50 }, () => [r() * W, r() * H, r() * 2 + 0.6, r() * 6, r() * 0.5 + 0.2]); })();
function dust(t, col = '255,200,150') { ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, r, ph, sp] of DUST) { const yy = (y - t * 12 * sp + H) % H; ctx.fillStyle = `rgba(${col},${0.2 + 0.15 * Math.sin(t + ph)})`; ctx.beginPath(); ctx.arc(x + Math.sin(t * 0.5 + ph) * 10, yy, r, 0, Math.PI * 2); ctx.fill(); } ctx.restore(); }
function push(t0, t1, t, s0, s1, cx, cy) { const s = lerp(s0, s1, smooth(t0, t1, t)); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); }

// ---------------- human (detailed side profile, facing right) ----------------
// origin = hip on the seat. lean: forward lean (0..1). look: head pitch (+down, -up). talk: 0..1
function humanShape(c, t, talk, lean, look) {
  const breathe = Math.sin(t * 1.6) * 0.006;
  c.save(); c.rotate(0.06 + lean * 0.22 + breathe);
  // torso (hoodie)
  c.beginPath();
  c.moveTo(-34, 4);
  c.bezierCurveTo(-44, -40, -44, -96, -30, -128);   // back
  c.bezierCurveTo(-22, -146, -8, -158, 6, -160);    // shoulder / hood base
  c.bezierCurveTo(22, -160, 34, -150, 38, -134);    // chest top
  c.bezierCurveTo(44, -104, 44, -60, 38, -26);      // chest / belly
  c.lineTo(36, 0); c.closePath(); c.fill();
  // hood fold behind neck
  c.beginPath(); c.moveTo(-26, -136); c.bezierCurveTo(-34, -152, -20, -168, -4, -166); c.lineTo(6, -150); c.closePath(); c.fill();
  // head
  c.save(); c.translate(10, -160); c.rotate(look * 0.25 + talk * 0.03 * Math.sin(t * 9));
  c.beginPath();
  c.moveTo(-10, 2);
  c.bezierCurveTo(-30, -10, -36, -46, -20, -70);  // back of skull
  c.bezierCurveTo(-6, -90, 30, -94, 46, -76);     // crown to forehead
  c.bezierCurveTo(52, -68, 53, -58, 51, -52);     // forehead / brow
  c.bezierCurveTo(54, -46, 60, -40, 62, -36);     // nose bridge -> tip
  c.lineTo(55, -32);                              // under nose
  c.lineTo(56, -28); c.lineTo(53, -25); c.lineTo(55, -21); // lips
  c.bezierCurveTo(54, -14, 50, -9, 43, -8);       // chin
  c.bezierCurveTo(34, -7, 26, -4, 22, 4);         // jaw -> neck
  c.lineTo(20, 14); c.lineTo(-6, 14); c.closePath(); c.fill();
  // hair (messy fringe)
  c.beginPath();
  c.moveTo(-26, -58); c.bezierCurveTo(-34, -84, -6, -104, 22, -98);
  c.bezierCurveTo(40, -96, 54, -84, 52, -70); c.lineTo(44, -72); c.lineTo(46, -64); c.lineTo(36, -72);
  c.bezierCurveTo(20, -76, 0, -72, -14, -50); c.closePath(); c.fill();
  // ear hint
  c.restore();
  // far arm: upper arm + forearm resting on thigh
  c.beginPath();
  c.moveTo(-6, -140); c.bezierCurveTo(-18, -110, -12, -70, 4, -52);
  c.bezierCurveTo(18, -40, 50, -34, 76, -26); c.lineTo(82, -14);
  c.bezierCurveTo(56, -16, 20, -20, -6, -36); c.bezierCurveTo(-26, -60, -28, -110, -18, -142); c.closePath(); c.fill();
  // hand
  c.beginPath(); c.ellipse(86, -20, 13, 9, 0.2, 0, Math.PI * 2); c.fill();
  c.restore();
  // thigh
  c.beginPath();
  c.moveTo(-34, 6); c.bezierCurveTo(-30, -24, 20, -26, 60, -20);
  c.bezierCurveTo(90, -18, 112, -16, 116, 0); c.bezierCurveTo(118, 14, 104, 20, 90, 20);
  c.lineTo(-30, 22); c.closePath(); c.fill();
  // shin (hanging, slight swing)
  const sw = Math.sin(t * 1.1) * 0.05;
  c.save(); c.translate(102, 6); c.rotate(sw);
  c.beginPath(); c.moveTo(-14, -6); c.bezierCurveTo(-10, 40, -4, 80, 0, 106); c.lineTo(22, 106);
  c.bezierCurveTo(20, 76, 22, 36, 16, -4); c.closePath(); c.fill();
  // sneaker
  c.beginPath(); c.moveTo(-6, 102); c.bezierCurveTo(-8, 118, 0, 124, 20, 124); c.lineTo(48, 124);
  c.bezierCurveTo(58, 124, 58, 114, 48, 110); c.bezierCurveTo(36, 106, 28, 100, 22, 98); c.closePath(); c.fill();
  c.restore();
}
function rimHex(c) { if (c[0] === '#') return c; const m = c.match(/\d+/g); return '#' + m.slice(0, 3).map(v => (+v).toString(16).padStart(2, '0')).join(''); }
function drawHuman(x, y, t, talk, lean, look, rim, rimDx = 3, rimDy = -2, body = '#0b070c', scale = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.save(); ctx.translate(rimDx, rimDy); ctx.fillStyle = rim; humanShape(ctx, t, talk, lean, look); ctx.restore();
  ctx.fillStyle = body; humanShape(ctx, t, talk, lean, look);
  // inner definition lines (arm, thigh) so the silhouette reads
  ctx.save(); ctx.rotate(0.06 + lean * 0.22 + Math.sin(t * 1.6) * 0.006); ctx.strokeStyle = hexA(rimHex(rim), 0.35); ctx.lineWidth = 1.6; ctx.beginPath();
  ctx.moveTo(-6, -140); ctx.bezierCurveTo(-18, -110, -12, -70, 4, -52); ctx.bezierCurveTo(18, -40, 50, -34, 76, -26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, -36); ctx.bezierCurveTo(20, -20, 56, -16, 80, -14); ctx.stroke(); ctx.restore();
  ctx.restore();
}

// ---------------- AXIS ----------------
function drawAxis(x, y, t, talk, p, look = -1, scale = 0.82) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 2) * 7); ctx.scale(scale, scale);
  const c = ctx;
  c.save(); c.globalCompositeOperation = 'lighter';
  const g = c.createRadialGradient(0, 200, 0, 0, 200, 70); g.addColorStop(0, hexA(p.eye, 0.5)); g.addColorStop(1, hexA(p.eye, 0));
  c.fillStyle = g; c.beginPath(); c.ellipse(0, 200, 70, 30, 0, 0, Math.PI * 2); c.fill(); c.restore();
  const body = () => { c.beginPath();
    c.moveTo(-62, 70); c.quadraticCurveTo(-66, 62, -56, 60); c.lineTo(56, 60); c.quadraticCurveTo(66, 62, 62, 70);
    c.lineTo(32, 176); c.quadraticCurveTo(28, 184, 20, 184); c.lineTo(-20, 184); c.quadraticCurveTo(-28, 184, -32, 176); c.closePath();
    rrect(c, -66, -48, 132, 104, 46);
    for (const s of [-1, 1]) { const hy = 112 + Math.sin(t * 2 + s) * 5; rrect(c, s * 96 - 13, hy - 24, 26, 48, 13); } };
  c.save(); c.translate(p.rimDx, p.rimDy); body(); c.fillStyle = p.rim; c.fill(); c.restore();
  body(); c.fillStyle = p.body; c.fill();
  c.save(); body(); c.clip(); const sg = c.createLinearGradient(-70, 0, 70, 0); sg.addColorStop(0, 'rgba(0,0,0,0.35)'); sg.addColorStop(1, 'rgba(255,255,255,0.03)'); c.fillStyle = sg; c.fillRect(-120, -60, 240, 260); c.restore();
  c.beginPath(); rrect(c, -52, -20, 104, 42, 21); c.fillStyle = '#04050a'; c.fill();
  c.save(); c.shadowColor = p.eye; c.shadowBlur = 14 + talk * 18; c.fillStyle = p.eye; c.globalAlpha = 0.75 + talk * 0.25;
  const bp = (t % 3.7), bl = bp < 0.14 ? 1 - Math.abs(bp - 0.07) / 0.07 : 0, eh = Math.max(7 * (1 - bl), 1.5);
  for (const s of [-1, 1]) { c.beginPath(); rrect(c, s * 22 - 13 + look * 6, 1 - eh / 2, 26, eh, eh / 2); c.fill(); }
  c.restore();
  c.save(); c.shadowColor = p.eye; c.shadowBlur = 18; c.fillStyle = p.eye; c.globalAlpha = 0.45 + 0.55 * talk; c.beginPath(); c.arc(0, 108, 9, 0, Math.PI * 2); c.fill(); c.restore();
  const a = t * 0.9; c.save(); c.rotate(-0.2);
  c.strokeStyle = hexA(p.eye, 0.5); c.lineWidth = 2; c.beginPath(); c.ellipse(0, 0, 100, 18, 0, 0, Math.PI * 2); c.stroke();
  c.shadowColor = p.eye; c.shadowBlur = 16; c.fillStyle = p.eye; c.beginPath(); c.arc(Math.cos(a) * 100, Math.sin(a) * 18, 5, 0, Math.PI * 2); c.fill(); c.restore();
  ctx.restore();
}
const EYE = '#7ff3ff';
function talkAt(sp, f) { const e = TL.env[sp]; return e[Math.min(f, e.length - 1)] || 0; }

// ---------------- mountains + Great Wall ----------------
const R0 = rng(11);
const LAYERS = [470, 545, 620, 700, 775].map((base, i) => {
  const amp = [170, 160, 140, 115, 80][i];
  const comps = Array.from({ length: 3 }, (_, k) => ({ A: amp / (k + 1.3) * (0.7 + R0() * 0.6), f: (0.0018 + R0() * 0.0016) * (k + 1), p: R0() * 6.28 }));
  const pts = []; for (let x = -160; x <= W + 160; x += 8) { let h = 0; for (const c of comps) h += c.A * Math.pow(1 - Math.abs(Math.sin(c.f * x + c.p)), 1.6); pts.push([x, base - h + amp * 0.35]); }
  return { base, pts };
});
function ridgeY(L, x) { const i = clamp(Math.floor((x + 160) / 8), 0, L.pts.length - 2); const p = L.pts[i], q = L.pts[i + 1]; return lerp(p[1], q[1], (x - p[0]) / 8); }
const WALLS = [{ li: 2, x0: 150, x1: 1750, th: 7, towers: [380, 820, 1290, 1640] }, { li: 3, x0: -50, x1: 1500, th: 11, towers: [210, 640, 1080] }, { li: 4, x0: -100, x1: 2000, th: 18, towers: [520, 1460] }];
function wallOn(L, w, col, i) {
  const dark = mix(col, '#000000', 0.35);
  ctx.strokeStyle = dark; ctx.lineWidth = w.th; ctx.lineJoin = 'round'; ctx.beginPath(); for (let x = w.x0; x <= w.x1; x += 8) ctx.lineTo(x, ridgeY(L, x) + 2); ctx.stroke();
  ctx.fillStyle = dark; for (let x = w.x0; x <= w.x1; x += w.th * 1.6) ctx.fillRect(x, ridgeY(L, x) + 2 - w.th, w.th * 0.8, w.th * 0.8);
  for (const tx of w.towers) { const y = ridgeY(L, tx); ctx.fillRect(tx - w.th * 1.6, y - w.th * 3.2, w.th * 3.2, w.th * 3.6); }
  ctx.strokeStyle = `rgba(255,170,110,${0.55 - i * 0.08})`; ctx.lineWidth = 1.2; ctx.beginPath(); for (let x = w.x0; x <= w.x1; x += 8) ctx.lineTo(x, ridgeY(L, x) + 2 - w.th / 2); ctx.stroke();
}
function sceneGreatWall(t, local, variant) {
  sunsetSky([[0, '#141a33'], [0.25, '#3b2a4f'], [0.45, '#a24e55'], [0.6, '#f08a4b'], [0.72, '#ffd08a'], [1, '#ffd08a']]);
  stars(0.5, t, 260);
  ctx.save();
  if (variant === 0) push(0, 1.7, local, 1.0, 1.06, 960, 600); else { ctx.translate(-260, -40); push(0, 3.2, local, 1.25, 1.33, 1220, 640); }
  bloomSun(1420, 600, 560, '#fff0c8', '#ff7a46');
  ctx.fillStyle = '#fff3d6'; ctx.beginPath(); ctx.arc(1420, 600, 34, 0, Math.PI * 2); ctx.fill();
  const cols = ['#d08a7c', '#a35e66', '#723b53', '#46223b', '#261324'];
  LAYERS.forEach((L, i) => {
    const hz = ctx.createLinearGradient(0, L.base - 260, 0, L.base + 40); hz.addColorStop(0, 'rgba(255,150,110,0)'); hz.addColorStop(1, `rgba(255,160,120,${0.22 - i * 0.03})`);
    ctx.fillStyle = hz; ctx.fillRect(-200, L.base - 260, W + 400, 300);
    ctx.beginPath(); ctx.moveTo(-160, H + 200); for (const [x, y] of L.pts) ctx.lineTo(x, y); ctx.lineTo(W + 160, H + 200); ctx.closePath();
    const lg = ctx.createLinearGradient(0, L.base - 180, 0, L.base + 220); lg.addColorStop(0, cols[i]); lg.addColorStop(1, mix(cols[i], '#0c0710', 0.55)); ctx.fillStyle = lg; ctx.fill();
    for (const w of WALLS) if (w.li === i) wallOn(L, w, cols[i], i);
  });
  dust(t); ctx.restore();
}

// ---------------- Statue of Liberty ----------------
function libertyPath(c) {
  c.beginPath();
  // pedestal
  c.moveTo(-150, 0); c.lineTo(-150, -40); c.lineTo(-118, -40); c.lineTo(-118, -70); c.lineTo(-92, -70); c.lineTo(-92, -250); c.lineTo(-104, -250); c.lineTo(-104, -268);
  c.lineTo(104, -268); c.lineTo(104, -250); c.lineTo(92, -250); c.lineTo(92, -70); c.lineTo(118, -70); c.lineTo(118, -40); c.lineTo(150, -40); c.lineTo(150, 0); c.closePath();
  // robe body
  c.moveTo(-50, -268); c.bezierCurveTo(-52, -360, -44, -440, -36, -500); c.lineTo(-30, -512); c.lineTo(30, -512);
  c.bezierCurveTo(44, -470, 50, -380, 54, -268); c.closePath();
  // tablet arm side
  c.moveTo(26, -500); c.lineTo(58, -470); c.lineTo(66, -400); c.lineTo(40, -392); c.lineTo(30, -440); c.closePath();
  c.moveTo(44, -470); c.lineTo(78, -462); c.lineTo(84, -390); c.lineTo(52, -384); c.closePath();
  // raised arm + torch
  c.moveTo(-34, -500); c.lineTo(-52, -640); c.lineTo(-38, -642); c.lineTo(-18, -506); c.closePath();
  c.moveTo(-62, -642); c.lineTo(-30, -642); c.lineTo(-38, -662); c.lineTo(-54, -662); c.closePath();
  c.moveTo(-46, -662); c.bezierCurveTo(-60, -676, -50, -694, -44, -704); c.bezierCurveTo(-40, -690, -30, -680, -46, -662); c.closePath();
  // head + crown rays
  c.moveTo(-14, -512); c.lineTo(-14, -526); c.arc(0, -540, 17, Math.PI * 0.75, Math.PI * 2.25); c.lineTo(14, -512); c.closePath();
  for (let k = 0; k < 7; k++) { const a = -Math.PI * 0.85 + k * (Math.PI * 0.7 / 6); const bx = Math.cos(a) * 16, by = -548 + Math.sin(a) * 14;
    c.moveTo(bx - 3, by); c.lineTo(Math.cos(a) * 46, -548 + Math.sin(a) * 40); c.lineTo(bx + 3, by); c.closePath(); }
}
function sceneLiberty(t, local) {
  sunsetSky([[0, '#1a1a38'], [0.3, '#4a2b52'], [0.55, '#c25a50'], [0.68, '#f39a55'], [0.72, '#ffd79a'], [1, '#3a1d2a']]);
  stars(0.4, t, 240);
  ctx.save(); push(0, 1.6, local, 1.0, 1.07, 1100, 600);
  bloomSun(1290, 770, 600, '#fff0c8', '#ff7a46');
  ctx.fillStyle = '#fff3d6'; ctx.beginPath(); ctx.arc(1290, 770, 40, 0, Math.PI * 2); ctx.fill();
  // far skyline (Manhattan-like generic towers)
  const r = rng(21); ctx.fillStyle = '#5a2c45';
  for (let x = -40; x < 900; x += 30 + r() * 30) { const h = 40 + r() * 120; ctx.fillRect(x, 778 - h, 26 + r() * 20, h); }
  // water
  const wg = ctx.createLinearGradient(0, 778, 0, H); wg.addColorStop(0, '#b45a52'); wg.addColorStop(1, '#1b0f1a'); ctx.fillStyle = wg; ctx.fillRect(-100, 778, W + 200, 400);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 26; k++) { const y = 790 + k * 10 + Math.sin(t * 2 + k) * 2, w = 180 - k * 5 + Math.sin(t * 3 + k * 1.7) * 30; ctx.fillStyle = `rgba(255,190,120,${0.35 - k * 0.012})`; ctx.fillRect(1290 - w / 2, y, w, 2); }
  ctx.restore();
  // island + statue
  ctx.fillStyle = '#140a12'; ctx.beginPath(); ctx.ellipse(820, 790, 330, 26, 0, Math.PI, 0); ctx.fill();
  ctx.save(); ctx.translate(820, 780); ctx.scale(0.95, 0.95);
  ctx.save(); ctx.translate(3, -2); libertyPath(ctx); ctx.fillStyle = 'rgba(255,150,90,0.8)'; ctx.fill(); ctx.restore();
  libertyPath(ctx); ctx.fillStyle = '#140a12'; ctx.fill();
  ctx.restore();
  dust(t); ctx.restore();
}

// ---------------- Pyramids ----------------
function scenePyramids(t, local) {
  sunsetSky([[0, '#1d1a36'], [0.3, '#5a3550'], [0.55, '#d8704a'], [0.68, '#ffb066'], [0.72, '#ffe0a0'], [1, '#2a1612']]);
  stars(0.35, t, 220);
  ctx.save(); push(0, 1.7, local, 1.06, 1.0, 960, 700);
  bloomSun(1060, 740, 620, '#fff0c8', '#ff8a46');
  ctx.fillStyle = '#fff3d6'; ctx.beginPath(); ctx.arc(1060, 742, 44, 0, Math.PI * 2); ctx.fill();
  const pyr = (cx, w, h, fill, rim) => { ctx.beginPath(); ctx.moveTo(cx - w / 2, 780); ctx.lineTo(cx, 780 - h); ctx.lineTo(cx + w / 2, 780); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx, 780 - h); ctx.lineTo(cx + w / 2, 780); ctx.lineTo(cx + w * 0.12, 780); ctx.closePath(); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
    ctx.strokeStyle = rim; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx - w / 2, 780); ctx.lineTo(cx, 780 - h); ctx.stroke(); };
  pyr(1520, 300, 170, '#6b3a3a', 'rgba(255,170,110,0.5)');
  pyr(1250, 560, 340, '#4a2730', 'rgba(255,170,110,0.6)');
  pyr(720, 700, 420, '#2c171f', 'rgba(255,170,110,0.7)');
  // dunes
  ctx.fillStyle = '#1a0e12'; ctx.beginPath(); ctx.moveTo(-100, H + 50);
  for (let x = -100; x <= W + 100; x += 20) ctx.lineTo(x, 800 + Math.sin(x * 0.004) * 26 + Math.sin(x * 0.011 + 1) * 10); ctx.lineTo(W + 100, H + 50); ctx.fill();
  ctx.strokeStyle = 'rgba(255,170,110,0.35)'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let x = -100; x <= W + 100; x += 20) ctx.lineTo(x, 800 + Math.sin(x * 0.004) * 26 + Math.sin(x * 0.011 + 1) * 10); ctx.stroke();
  dust(t); ctx.restore();
}

// ---------------- Paris ----------------
const EIFFEL = offscreen(420, 820, (c) => {
  c.translate(210, 800); c.fillStyle = '#000';
  // outline: four legs + platforms + spire
  const prof = y => { // half-width at height y (y negative up)
    const h = -y; if (h < 150) return 200 - h * 0.62; if (h < 330) return 107 - (h - 150) * 0.28; return Math.max(56 * Math.pow(1 - (h - 330) / 420, 1.6), 5); };
  c.beginPath(); c.moveTo(-prof(0), 0);
  for (let y = 0; y >= -750; y -= 6) c.lineTo(-prof(y), y);
  c.lineTo(-3, -790); c.lineTo(3, -790);
  for (let y = -750; y <= 0; y += 6) c.lineTo(prof(y), y);
  c.closePath(); c.fill();
  // platforms
  c.fillRect(-122, -158, 244, 16); c.fillRect(-64, -338, 128, 12); c.fillRect(-16, -700, 32, 18);
  // arch cut + lattice holes
  c.globalCompositeOperation = 'destination-out';
  c.beginPath(); c.moveTo(-150, 2); c.bezierCurveTo(-120, -120, 120, -120, 150, 2); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(-82, -170); c.bezierCurveTo(-60, -260, 60, -260, 82, -170); c.closePath(); c.fill();
  c.lineWidth = 1.1;
  for (let y = -170; y > -690; y -= 34) { const w = prof(y) - 8; c.beginPath(); c.moveTo(-w, y); c.lineTo(w * 0.1, y - 22); c.moveTo(w, y); c.lineTo(-w * 0.1, y - 22); c.stroke(); }
});
const EIFFEL_T = offscreen(420, 820, (c) => { c.drawImage(EIFFEL, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = '#5a2a43'; c.fillRect(0, 0, 420, 820); });
const PARIS = (() => { const r = rng(77); const rows = [];
  [[700, 0.55, 50, 90, 26], [742, 0.75, 70, 130, 38], [790, 1.0, 90, 170, 52]].forEach(([base, sc, minW, maxW, roof], ri) => {
    const b = []; for (let x = -100; x < W + 100;) { const w = minW + r() * (maxW - minW), h = (60 + r() * 70) * sc;
      const wins = []; for (let k = 0; k < 10; k++) if (r() < 0.35 - ri * 0.05) wins.push([r() * (w - 16) + 4, r() * (h - 14) + 6, r()]);
      const chim = []; const nc = Math.floor(r() * 3); for (let k = 0; k < nc; k++) chim.push([r() * (w - 20) + 4, 10 + r() * 14]);
      b.push({ x, w, h, roof: roof * (0.7 + r() * 0.5), wins, chim }); x += w + r() * 6; }
    rows.push({ base, b, ri }); });
  return rows; })();
function sceneParis(t, local, riseU) {
  // sky (sunset -> space during rise)
  const u = riseU, uc = smooth(0, 0.45, riseU);
  sunsetSky([[0, mix('#151a36', '#000005', uc)], [0.3, mix('#3d2a52', '#02030c', uc)], [0.55, mix('#b8584f', '#050816', uc)], [0.66, mix('#f2934e', '#070d22', uc)], [0.72, mix('#ffd497', '#0a1430', uc)], [1, mix('#ffd497', '#0a1430', uc)]]);
  stars(0.35 + u * 0.65, t, lerp(250, H, u));
  ctx.save();
  const lift = easeInOut(u) * 1500;  // world falls away during rise
  push(0, 14, local, 1.0, 1.06, 900, 640);
  ctx.translate(0, lift);
  bloomSun(1180, 700, 640, '#fff0c8', '#ff7a46', 1 - u * 0.6);
  ctx.fillStyle = '#fff3d6'; ctx.beginPath(); ctx.arc(1180, 702, 36, 0, Math.PI * 2); ctx.fill();
  // haze far
  const hz = ctx.createLinearGradient(0, 560, 0, 760); hz.addColorStop(0, 'rgba(255,150,110,0)'); hz.addColorStop(1, 'rgba(255,170,120,0.25)'); ctx.fillStyle = hz; ctx.fillRect(-200, 560, W + 400, 200);
  const rowCol = ['#7a3e52', '#4a2438', '#26131f'];
  PARIS.forEach((row, ri) => {
    if (ri === 1) { // eiffel between rows
      ctx.save(); ctx.translate(1390, 740); ctx.scale(0.72, 0.72); ctx.translate(-210, -800);
      ctx.drawImage(EIFFEL_T, 0, 0); ctx.restore();
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,220,150,0.9)'; ctx.beginPath(); ctx.arc(1390, 740 - 790 * 0.72, 3 + Math.sin(t * 4) * 1, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    for (const b of row.b) {
      const top = row.base - b.h;
      ctx.fillStyle = rowCol[ri];
      ctx.beginPath(); ctx.moveTo(b.x, row.base + 400); ctx.lineTo(b.x, top); ctx.lineTo(b.x + b.roof * 0.35, top - b.roof); ctx.lineTo(b.x + b.w - b.roof * 0.35, top - b.roof); ctx.lineTo(b.x + b.w, top); ctx.lineTo(b.x + b.w, row.base + 400); ctx.fill();
      for (const [cx, ch] of b.chim) ctx.fillRect(b.x + cx, top - b.roof - ch, 12, ch + 2);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const [wx, wy, ph] of b.wins) { ctx.fillStyle = `rgba(255,190,110,${(0.25 + 0.2 * ri) * (0.7 + 0.3 * Math.sin(t * 0.7 + ph * 9))})`; ctx.fillRect(b.x + wx, top + wy, 5 + ri * 2, 7 + ri * 2); }
      ctx.restore();
    }
    const h2 = ctx.createLinearGradient(0, row.base - 160, 0, row.base + 40); h2.addColorStop(0, 'rgba(255,150,110,0)'); h2.addColorStop(1, `rgba(255,150,110,${0.12 - ri * 0.04})`); ctx.fillStyle = h2; ctx.fillRect(-200, row.base - 160, W + 400, 200);
  });
  // foreground rooftop: ledge + zinc slope
  ctx.fillStyle = '#0e080d'; ctx.beginPath(); ctx.moveTo(-100, 808); ctx.lineTo(W + 100, 808); ctx.lineTo(W + 100, H + 400); ctx.lineTo(-100, H + 400); ctx.fill();
  ctx.fillStyle = '#140b12'; ctx.fillRect(-100, 800, W + 200, 16);
  ctx.fillStyle = 'rgba(255,160,100,0.55)'; ctx.fillRect(-100, 799, W + 200, 2);
  ctx.strokeStyle = 'rgba(255,160,100,0.08)'; ctx.lineWidth = 2; for (let x = -100; x < W + 100; x += 46) { ctx.beginPath(); ctx.moveTo(x, 818); ctx.lineTo(x - 30, H + 20); ctx.stroke(); }
  // chimney stack left
  ctx.fillStyle = '#0e080d'; ctx.fillRect(210, 640, 120, 162); ctx.fillRect(200, 632, 140, 14);
  for (let k = 0; k < 4; k++) ctx.fillRect(220 + k * 28, 600, 16, 34);
  ctx.fillStyle = 'rgba(255,160,100,0.5)'; ctx.fillRect(330, 646, 2, 156); ctx.fillRect(200, 631, 140, 2);
  // antenna
  ctx.strokeStyle = '#0e080d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(1650, 802); ctx.lineTo(1650, 640); ctx.moveTo(1610, 670); ctx.lineTo(1690, 670); ctx.moveTo(1620, 700); ctx.lineTo(1680, 700); ctx.stroke();
  ctx.restore();
}

// ---------------- space / Earth ----------------
const EARTH_TEX = (() => {
  const r = rng(42);
  const land = offscreen(4096, 700, (c) => {
    for (let k = 0; k < 30; k++) { const x = r() * 4096, y = 60 + r() * 600, s = 70 + r() * 240; c.fillStyle = ['#4b5230', '#5d5638', '#3f4a2c', '#6a5a40', '#7a6a4a'][k % 5];
      c.beginPath(); for (let j = 0; j < 10; j++) { const px = x + (r() - 0.5) * s * 1.8, py = y + (r() - 0.5) * s * 0.45; c.moveTo(px + s * 0.3, py); c.ellipse(px, py, s * (0.2 + r() * 0.35), s * (0.08 + r() * 0.12), 0, 0, Math.PI * 2); } c.fill(); } });
  const cloud = offscreen(4096, 700, (c) => {
    for (let k = 0; k < 900; k++) { const x = r() * 4096, y = r() * 700, s = 6 + r() * 34; c.fillStyle = `rgba(255,255,255,${0.18 + r() * 0.42})`; c.beginPath(); c.ellipse(x, y, s * (2.5 + r() * 3), s * 0.32, (r() - 0.5) * 0.25, 0, Math.PI * 2); c.fill(); } });
  return offscreen(4096, 700, (c) => { c.globalAlpha = 0.6; c.filter = 'blur(4px)'; c.drawImage(land, 0, 0); c.globalAlpha = 1; c.filter = 'blur(3px)'; c.drawImage(cloud, 0, 0); c.filter = 'none'; });
})();
function drawEarth(topY, t, light = 1) {
  const R = 2600, cx = 960, cy = topY + R;
  ctx.save();
  // atmosphere glow
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const ag = ctx.createRadialGradient(cx, cy, R - 10, cx, cy, R + 90); ag.addColorStop(0, `rgba(90,170,255,${0.55 * light})`); ag.addColorStop(0.25, `rgba(70,140,255,${0.25 * light})`); ag.addColorStop(1, 'rgba(40,90,255,0)');
  ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(cx, cy, R + 90, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  const og = ctx.createLinearGradient(0, topY, 0, topY + 500); og.addColorStop(0, '#2a62a8'); og.addColorStop(0.4, '#123c78'); og.addColorStop(1, '#061634'); ctx.fillStyle = og; ctx.fillRect(0, topY, W, H - topY + 10);
  const sx = -((t * 30) % 4096);
  for (const ox of [sx, sx + 4096]) ctx.drawImage(EARTH_TEX, ox, topY - 10, 4096, 460);
  const pg = ctx.createLinearGradient(0, topY, 0, topY + 140); pg.addColorStop(0, 'rgba(120,180,255,0.45)'); pg.addColorStop(1, 'rgba(120,180,255,0)'); ctx.fillStyle = pg; ctx.fillRect(0, topY - 5, W, 150);
  // limb shading + rim
  const lg = ctx.createRadialGradient(cx, cy, R * 0.985, cx, cy, R); lg.addColorStop(0, 'rgba(0,10,30,0)'); lg.addColorStop(1, 'rgba(120,190,255,0.35)'); ctx.fillStyle = lg; ctx.fillRect(0, topY - 5, W, 220);
  const dark = ctx.createLinearGradient(0, 0, W, 0); dark.addColorStop(0, 'rgba(0,0,10,0.0)'); dark.addColorStop(0.6, 'rgba(0,0,12,0.25)'); dark.addColorStop(1, 'rgba(0,0,12,0.7)'); ctx.fillStyle = dark; ctx.fillRect(0, topY - 5, W, H);
  ctx.restore();
  ctx.save(); ctx.strokeStyle = `rgba(170,220,255,${0.9 * light})`; ctx.lineWidth = 2.5; ctx.shadowColor = '#8fd0ff'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(cx, cy, R + 1, Math.PI * 1.3, Math.PI * 1.7); ctx.stroke(); ctx.restore();
}
function platform(x, y, a, t) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, 260); g.addColorStop(0, 'rgba(127,243,255,0.25)'); g.addColorStop(1, 'rgba(127,243,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, 260, 34, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(127,243,255,0.8)'; ctx.lineWidth = 2; ctx.shadowColor = EYE; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.ellipse(x, y, 240, 30, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(127,243,255,0.35)';
  for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.ellipse(x, y, 240 * k / 4, 30 * k / 4, 0, 0, Math.PI * 2); ctx.stroke(); }
  const a2 = t * 0.8; ctx.beginPath(); ctx.moveTo(x + Math.cos(a2) * 240, y + Math.sin(a2) * 30); ctx.lineTo(x - Math.cos(a2) * 240, y - Math.sin(a2) * 30); ctx.stroke();
  ctx.restore();
}
const CLOUDS = (() => { const r = rng(55); return Array.from({ length: 40 }, () => [r() * W * 1.4 - 200, r() * 900, 160 + r() * 340, 40 + r() * 70, r()]); })();
function riseClouds(u) {
  const band = smooth(0.08, 0.2, u) * (1 - smooth(0.38, 0.5, u)); if (band <= 0) return;
  const off = lerp(-1100, 1900, smooth(0.08, 0.5, u));
  ctx.save(); ctx.filter = 'blur(10px)';
  for (const [x, y, w, h, ph] of CLOUDS) { const yy = y + off; if (yy < -200 || yy > H + 200) continue;
    ctx.fillStyle = `rgba(${Math.round(lerp(255, 120, u))},${Math.round(lerp(190, 150, u))},${Math.round(lerp(160, 200, u))},${0.32 * band})`; ctx.beginPath(); ctx.ellipse(x, yy, w, h * 0.6, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

// ---------------- captions & HUD ----------------
function captions(t) {
  const ln = TL.lines.find(l => t >= l.start - 0.05 && t <= l.end + 0.25); if (!ln) return;
  ctx.save(); ctx.font = '600 40px Inter'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff'; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 14;
  ctx.globalAlpha = smooth(ln.start - 0.05, ln.start + 0.1, t) * (1 - smooth(ln.end + 0.1, ln.end + 0.25, t));
  ctx.fillText(ln.text, W / 2, 1000); ctx.restore();
}
function altitudeHUD(t, km, a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '600 15px Inter'; ctx.fillText('ALTITUDE', 72, 88);
  ctx.fillStyle = '#ffffff'; ctx.font = '600 44px Inter'; ctx.fillText(Math.round(km).toLocaleString('en-US') + ' km', 70, 136);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(56, 70); ctx.lineTo(56, 146); ctx.stroke();
  ctx.restore();
}
function landmarkTag(text, sub, local) {
  const a = smooth(0.15, 0.45, local) * (1 - smooth(1.25, 1.5, local)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = '600 22px Inter'; ctx.fillText(text, 72, 96);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '500 16px Inter'; ctx.fillText(sub, 72, 122); ctx.restore();
}

// ---------------- master render ----------------
const HUMAN = { x: 760, y: 800 }, AX = { x: 1010, y: 585 };
window.render = function (f) {
  const t = f / TL.fps, S = TL.scenes;
  const tH = talkAt('H', f), tA = talkAt('A', f);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); ctx.filter = 'none';
  if (t < S.m2) { sceneLiberty(t, t - S.m1); vignette(0.6); landmarkTag('NEW YORK', 'Statue of Liberty', t - S.m1); }
  else if (t < S.m3) { scenePyramids(t, t - S.m2); vignette(0.6); landmarkTag('GIZA', 'Great Pyramids', t - S.m2); }
  else if (t < S.paris) { sceneGreatWall(t, t - S.m3, 0); vignette(0.6); landmarkTag('NORTHERN CHINA', 'Great Wall', t - S.m3); }
  else if (t >= S.wallIn && t < S.wallOut) { sceneGreatWall(t, t - S.wallIn, 1); vignette(0.6); }
  else {
    const u = clamp((t - S.riseStart) / (S.riseEnd - S.riseStart));
    const inSpace = t >= S.riseEnd;
    if (!inSpace) sceneParis(t, t - S.paris, u);
    else { ctx.fillStyle = '#000005'; ctx.fillRect(0, 0, W, H); stars(1, t); }
    // earth appears late in the rise
    const ue = smooth(0.22, 0.9, u);
    if (ue > 0 || inSpace) { const k = inSpace ? 1 : ue; const topY = lerp(1700, 720, easeInOut(k)) + (inSpace ? Math.sin((t - S.riseEnd) * 0.4) * 4 : 0);
      ctx.save(); if (inSpace) push(0, 6, t - S.riseEnd, 1.0, 1.04, 960, 760); drawEarth(topY, t, 1); ctx.restore();
      if (!inSpace) { ctx.save(); ctx.globalAlpha = 1 - smooth(0.85, 1, u); ctx.restore(); } }
    riseClouds(u);
    // characters
    const rimC = mix('#ff9a5c', '#7fb8ff', smooth(0.3, 0.9, u));
    const pa = smooth(S.riseStart - 0.8, S.riseStart + 0.2, t);
    const floatY = smooth(S.riseStart, S.riseStart + 1.5, t) * Math.sin(t * 1.3) * 5;
    const lookDown = smooth(S.riseEnd + 1.2, S.riseEnd + 2.2, t);
    const lookUp = (t > TL.lines[4].start - 0.2 && t < TL.lines[6].end) ? -0.3 : 0;
    ctx.save(); if (inSpace) push(0, 6, t - S.riseEnd, 1.0, 1.04, 960, 760);
    platform(HUMAN.x + 120, HUMAN.y + 20 + floatY, pa, t);
    drawHuman(HUMAN.x, HUMAN.y + floatY, t, tH, lookDown * 0.55, lookDown * 0.9 + lookUp * (1 - lookDown), rimC);
    drawAxis(AX.x, AX.y + floatY, t, tA, { body: '#1a1d27', rim: rimC, rimDx: 3, rimDy: -2, eye: EYE }, lookDown > 0.5 ? 0 : -1);
    ctx.restore();
    if (!inSpace) dust(t, `${Math.round(lerp(255, 160, u))},${Math.round(lerp(200, 210, u))},${Math.round(lerp(150, 255, u))}`);
    vignette(0.6);
    const km = inSpace ? 400 : 400 * Math.pow(easeInOut(u), 2.2);

  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  grain(0.09, f);
  captions(t);
  const fade = smooth(0, 0.5, t) * (1 - smooth(TL.scenes.end - 0.8, TL.scenes.end, t));
  if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fade})`; ctx.fillRect(0, 0, W, H); }
  return cv.toDataURL('image/png');
};
